name: Generate Keystore

on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore zokas-release.jks \
            -alias zokas \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zokas123 \
            -keypass zokas123 \
            -dname "CN=ZoKas, OU=Dev, O=ZoKas, L=Jakarta, S=Jakarta, C=ID"

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: zokas-keystore
          path: zokas-release.jks