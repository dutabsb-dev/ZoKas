name: Build APK and AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            TARGET_KS="${KEYSTORE_FILE:-zokas-release.jks}"
            echo "$KEYSTORE_BASE64" | base64 -d > "$TARGET_KS"
            echo "$KEYSTORE_BASE64" | base64 -d > "app/$TARGET_KS"
          fi

      - name: Build Play AAB and Sideload APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE || 'zokas-release.jks' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease assembleSideloadRelease --no-daemon

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoKas-Play-AAB
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: warn

      - name: Upload Sideload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoKas-Sideload-APK
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: warn
