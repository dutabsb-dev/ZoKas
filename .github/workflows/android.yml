name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Official Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > app/zokas-release.jks

      # PERINTAH BARU: Membuat APK (assembleRelease) dan AAB (bundleRelease) sekaligus
      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      # Upload APK (Untuk diinstal di HP)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zokas-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Upload AAB (Untuk Google Play Store)
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: zokas-release-aab
          path: app/build/outputs/bundle/release/app-release.aab