name: Build APK and AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7 (compatible with AGP 8.2.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Ensure Gradle Wrapper 8.7 exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          fi
          chmod +x ./gradlew

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE_SECRET: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            TARGET_KS="${KEYSTORE_FILE_SECRET:-zokas-release.jks}"
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/$TARGET_KS"
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/$TARGET_KS"
            echo "ACTIVE_KEYSTORE_PATH=$GITHUB_WORKSPACE/$TARGET_KS" >> "$GITHUB_ENV"
          fi

      - name: Build Play Store AAB & Sideload APK
        env:
          KEYSTORE_FILE: ${{ env.ACTIVE_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease assembleSideloadRelease --no-daemon --no-configuration-cache

      - name: Package Native Debug Symbols & Mapping
        run: |
          mkdir -p app/build/play-assets
          if [ -f "app/build/outputs/mapping/playRelease/mapping.txt" ]; then
            cp app/build/outputs/mapping/playRelease/mapping.txt app/build/play-assets/mapping.txt
          elif [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp app/build/outputs/mapping/release/mapping.txt app/build/play-assets/mapping.txt
          fi
          SYM_SRC=""
          if [ -d "app/build/intermediates/merged_native_libs/playRelease/out/lib" ]; then
            SYM_SRC="app/build/intermediates/merged_native_libs/playRelease/out/lib"
          elif [ -d "app/build/intermediates/stripped_native_libs/playRelease/out/lib" ]; then
            SYM_SRC="app/build/intermediates/stripped_native_libs/playRelease/out/lib"
          fi
          if [ -n "$SYM_SRC" ]; then
            (cd "$SYM_SRC" && zip -r "$GITHUB_WORKSPACE/app/build/play-assets/native-debug-symbols.zip" .) || true
          fi

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoKas-Play-AAB
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload Play Deobfuscation & Native Debug Symbols Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZoKas-Play-Symbols-And-Mapping
          path: app/build/play-assets/*
          if-no-files-found: ignore

      - name: Upload Sideload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoKas-Sideload-APK
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
